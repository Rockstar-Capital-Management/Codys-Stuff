# Goes in the Codys-Stuff repo at .github/workflows/portfolio-refresh.yml
# Refreshes the Portfolio Dashboard page (portfolio/index.html) from Supabase every morning, on GitHub's servers.
# Read-only against Supabase. A run with nothing new makes no commit; a run that fails its checks changes nothing.
name: Portfolio dashboard refresh

on:
  schedule:
    # 12:30 UTC = 6:30 AM Central in winter, 7:30 AM in summer; the daily rent roll lands in Supabase before then.
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild the dashboard data from Supabase
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_READ_KEY }}
        run: node tools/portfolio-refresh/refresh.js --page portfolio/index.html --write

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- portfolio/index.html; then
            echo "No change."
          else
            git config user.name "portfolio-refresh"
            git config user.email "portfolio-refresh@users.noreply.github.com"
            git add portfolio/index.html
            git commit -m "Auto-refresh: portfolio dashboard from Supabase"
            git push origin main
          fi
